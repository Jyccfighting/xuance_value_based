dl_toolbox: "torch"
project_name: "DoubleDQN_MountainCar-v0"
logger: "wandb"
wandb_user_name: "2797824480"

agent: "DDQN"
env_name: "Classic Control"
env_id: "MountainCar-v0"
env_seed: 1  # The random seed of the environment.
vectorize: "DummyVecEnv"
policy: "Basic_Q_network"
representation: "Basic_MLP"
learner: "DDQN_Learner"
runner: "DRL"

representation_hidden_size: [128,]
q_hidden_size: [128,]
activation: 'relu'

seed: 1
parallels: 10
buffer_size: 200000
batch_size: 256
learning_rate: 0.001
gamma: 0.99

start_greedy: 1.0
end_greedy: 0.01
decay_step_greedy: 100000
sync_frequency: 100
training_frequency: 1
running_steps: 1000000
start_training: 1000

use_grad_clip: False  # gradient normalization
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: False  # Whether to use observation normalization trick.
use_rewnorm: False  # Whether to use reward normalization trick.
obsnorm_range: 5
rewnorm_range: 5

eval_interval: 50000
test_episode: 10
log_dir: "logs/ddqn/"
model_dir: "models/ddqn/"