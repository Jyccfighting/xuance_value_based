dl_toolbox: "torch"
project_name: "PERDQN_MountainCar-v0"
logger: "wandb"
wandb_user_name: "2797824480"

agent: "PerDQN"
env_name: "Classic Control"
env_id: "MountainCar-v0"
env_seed: 42  #1  # The random seed of the environment.
vectorize: "DummyVecEnv"
learner: "PerDQN_Learner"
policy: "Basic_Q_network"
representation: "Basic_MLP"
runner: "DRL"

representation_hidden_size: [256,]  #[128,]
q_hidden_size: [256,]  #[128,]
activation: 'relu'

seed: 1
parallels: 10
buffer_size: 200000
batch_size: 256
learning_rate: 0.0005  #0.001
gamma: 0.99

start_greedy: 1.0
end_greedy: 0.01   #0.1
decay_step_greedy: 300000  #100000
sync_frequency: 100
training_frequency: 1
running_steps: 2000000   #1000000
start_training: 1000

use_grad_clip: False  # gradient normalization
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: True  #False  # Whether to use observation normalization trick.
use_rewnorm: True  #False  # Whether to use reward normalization trick.
obsnorm_range: 5
rewnorm_range: 5

PER_alpha: 0.6  #0.5
PER_beta0: 0.6  #0.4

eval_interval: 50000
test_episode: 10
log_dir: "logs/perdqn/"
model_dir: "models/perdqn/"